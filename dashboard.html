<script>
async function getSession(){
const response=await fetch("/api/auth?action=session",{
method:"GET",
credentials:"include",
cache:"no-store"
});

const data=await response.json().catch(()=>({}));

if(!response.ok||!data.success){
window.location.replace("/login.html");
return null;
}

return data.user;
}

async function loadDashboard(){
const user=await getSession();

if(!user)return;

document.getElementById("accountName").textContent=user.username;
document.getElementById("accountEmail").textContent=user.email||"";
document.getElementById("username").value=user.username;
document.getElementById("welcomeUser").textContent="@"+user.username;

try{
const response=await fetch(
"/api/profile?username="+encodeURIComponent(user.username),
{
credentials:"include",
cache:"no-store"
}
);

const data=await response.json();

if(data.profile){
state.profile=data.profile;
state.profile.links=state.profile.links||[];

document.getElementById("displayName").value=data.profile.displayName||"";
document.getElementById("bio").value=data.profile.bio||"";

if(data.profile.profilePicture){
document.getElementById("profilePicturePreview").src=data.profile.profilePicture;
document.getElementById("previewAvatar").src=data.profile.profilePicture;
document.getElementById("accountAvatar").src=data.profile.profilePicture;
}

if(data.profile.background){
document.getElementById("backgroundPreview").style.backgroundImage=`url("${data.profile.background}")`;
document.getElementById("backgroundPreview").style.backgroundSize="cover";
document.getElementById("backgroundPreview").style.backgroundPosition="center";
document.getElementById("previewBg").style.backgroundImage=`url("${data.profile.background}")`;
}

if(data.profile.lanyard&&data.profile.lanyard.id){
document.getElementById("discordId").value=data.profile.lanyard.id;
}

renderLinks();
updatePreview();
updateChecklist();
}
}catch(error){
console.error(error);
}
}

document.getElementById("logout").onclick=async()=>{
try{
await fetch("/api/auth?action=logout",{
method:"POST",
credentials:"include"
});
}catch{}

window.location.replace("/login.html");
};

loadDashboard();
</script>
