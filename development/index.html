```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biofyit Developers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #050208;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.25), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.18), transparent 32%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(168, 85, 247, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.5) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      padding: 24px;
    }

    .card {
      padding: 42px;
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 24px;
      background: rgba(12, 7, 18, 0.86);
      backdrop-filter: blur(24px);
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.55),
        0 0 70px rgba(124, 58, 237, 0.08);
    }

    .logo {
      display: block;
      width: 190px;
      max-width: 75%;
      height: auto;
      margin: 0 auto 34px;
    }

    .badge {
      width: fit-content;
      margin: 0 auto 12px;
      padding: 7px 12px;
      border: 1px solid rgba(168, 85, 247, 0.24);
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.08);
      color: #c084fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
      letter-spacing: -1px;
    }

    .description {
      margin: 12px 0 30px;
      color: #938a9f;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d9d1df;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #2a2231;
      border-radius: 11px;
      outline: none;
      background: #09060d;
      color: #fff;
      font-size: 14px;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #5e5665;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .signin {
      width: 100%;
      height: 51px;
      margin-top: 5px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #9333ea, #6d28d9);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .signin:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.3);
    }

    .signin:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      text-align: center;
      font-size: 13px;
    }

    .footer {
      margin-top: 27px;
      text-align: center;
      color: #514a58;
      font-size: 11px;
    }

    @media (max-width: 500px) {
      .card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <img
        src="biofyit.png"
        alt="Biofyit"
        class="logo"
      >

      <div class="badge">
        DEVELOPER PORTAL
      </div>

      <h1>Welcome back.</h1>

      <p class="description">
        Sign in to access the Biofyit developer platform.
      </p>

      <form id="signinForm">

        <div class="field">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="signin" id="signinButton">
          Sign In
        </button>

        <div class="message" id="message">
          Invalid email or password.
        </div>

      </form>

      <div class="footer">
        © 2026 Biofyit
      </div>

    </div>

  </div>

  <script>
    const form = document.getElementById("signinForm");
    const message = document.getElementById("message");
    const button = document.getElementById("signinButton");

    fetch("/api/session")
      .then(response => {
        if (response.ok) {
          window.location.href = "/development/portal.html";
        }
      })
      .catch(() => {});

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.style.display = "none";
      button.disabled = true;
      button.textContent = "Signing In...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent = data.error || "Invalid email or password.";
          message.style.display = "block";
          button.disabled = false;
          button.textContent = "Sign In";
          return;
        }

        window.location.href = "/development/portal.html";

      } catch {
        message.textContent = "Unable to connect to the authentication service.";
        message.style.display = "block";
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>

</body>
</html>
```
