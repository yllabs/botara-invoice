<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biofyit | Under Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: #06030b;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(119, 58, 255, 0.18),
          transparent 34%
        ),
        radial-gradient(
          circle at 15% 15%,
          rgba(95, 39, 190, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(122, 52, 230, 0.09),
          transparent 30%
        ),
        #06030b;
    }

    .glow {
      position: absolute;
      width: 550px;
      height: 550px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(126, 62, 255, 0.08);
      filter: blur(120px);
      animation: glowPulse 6s ease-in-out infinite;
    }

    .glowTwo {
      position: absolute;
      width: 260px;
      height: 260px;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(170, 105, 255, 0.08);
      filter: blur(80px);
      animation: glowSmall 4s ease-in-out infinite;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.11;
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );
      background-size: 55px 55px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent
      );
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .content {
      width: 100%;
      max-width: 720px;
      text-align: center;
      animation: appear 1s ease forwards;
    }

    .logo {
      display: block;
      width: 310px;
      max-width: 75vw;
      height: auto;
      margin: 0 auto 26px;
      object-fit: contain;
      filter:
        drop-shadow(0 0 20px rgba(137, 71, 255, 0.40))
        drop-shadow(0 0 45px rgba(112, 48, 255, 0.16));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      margin-bottom: 23px;
      border-radius: 999px;
      background: rgba(128, 64, 255, 0.10);
      border: 1px solid rgba(151, 103, 255, 0.20);
      color: #c8adff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .statusDot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #9a63ff;
      box-shadow: 0 0 13px #9a63ff;
      animation: blink 2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 8vw, 78px);
      line-height: 0.98;
      letter-spacing: -4px;
      font-weight: 800;
    }

    h1 span {
      display: block;
      margin-top: 7px;
      background: linear-gradient(
        90deg,
        #ffffff,
        #c29cff,
        #8c4cff
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      max-width: 580px;
      margin: 26px auto 0;
      color: #918b9d;
      font-size: 16px;
      line-height: 1.75;
    }

    .divider {
      width: 90px;
      height: 1px;
      margin: 34px auto 24px;
      background: linear-gradient(
        90deg,
        transparent,
        #8d4dff,
        transparent
      );
    }

    .smallText {
      margin: 0;
      color: #625b6d;
      font-size: 13px;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 3;
      text-align: center;
      color: #4e4858;
      font-size: 12px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(0.9);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    @keyframes glowSmall {
      0%,
      100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(0.85);
      }

      50% {
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }

      .logo {
        width: 230px;
        max-width: 72vw;
        margin-bottom: 22px;
      }

      h1 {
        font-size: 47px;
        letter-spacing: -2.5px;
      }

      .description {
        margin-top: 22px;
        font-size: 15px;
        line-height: 1.7;
      }

      .footer {
        bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="glow"></div>
    <div class="glowTwo"></div>
    <div class="grid"></div>
  </div>

  <div class="container">
    <main class="content">

      <img
        src="biofyit-logo.png"
        alt="Biofy"
        class="logo"
      >

      <div class="status">
        <span class="statusDot"></span>
        Under Maintenance
      </div>

      <h1>
        We're working
        <span>behind the scenes.</span>
      </h1>

      <p class="description">
        Biofyit is currently being worked on while we build and improve
        the platform. We're creating a free place where anyone can create
        and share their own personal bio page.
      </p>

      <div class="divider"></div>

      <p class="smallText">
        The site will be back soon.
      </p>

    </main>
  </div>

  <div class="footer">
    © 2026 Biofyit
  </div>

</body>
</html>
