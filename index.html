<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biofyit | Under Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #07030d;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(137, 65, 255, 0.20),
          transparent 34%
        ),
        radial-gradient(
          circle at 10% 10%,
          rgba(91, 35, 180, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(115, 45, 220, 0.08),
          transparent 30%
        ),
        #07030d;
    }

    .glow {
      position: absolute;
      width: 520px;
      height: 520px;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(126, 62, 255, 0.08);
      filter: blur(110px);
      animation: pulse 6s ease-in-out infinite;
    }

    .glow-small {
      position: absolute;
      width: 240px;
      height: 240px;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(171, 106, 255, 0.08);
      filter: blur(75px);
      animation: pulseSmall 4s ease-in-out infinite;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .content {
      width: 100%;
      max-width: 700px;
      text-align: center;
      animation: appear 1s ease forwards;
    }

    .logo-wrapper {
      width: 150px;
      height: 150px;
      margin: 0 auto 28px;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 38px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 0 80px rgba(126, 63, 255, 0.20),
        inset 0 0 40px rgba(126, 63, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(
        0 0 25px rgba(145, 85, 255, 0.45)
      );
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      margin-bottom: 22px;
      border-radius: 999px;
      background: rgba(128, 64, 255, 0.10);
      border: 1px solid rgba(151, 103, 255, 0.20);
      color: #c7aaff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #9a63ff;
      box-shadow: 0 0 12px #9a63ff;
      animation: blink 2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 78px);
      line-height: 0.98;
      letter-spacing: -4px;
      font-weight: 800;
    }

    h1 span {
      display: block;
      margin-top: 7px;
      background: linear-gradient(
        90deg,
        #ffffff,
        #c09aff,
        #8c4cff
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      max-width: 580px;
      margin: 26px auto 0;
      color: #918b9d;
      font-size: 16px;
      line-height: 1.75;
    }

    .divider {
      width: 85px;
      height: 1px;
      margin: 34px auto 24px;
      background: linear-gradient(
        90deg,
        transparent,
        #8d4dff,
        transparent
      );
    }

    .small-text {
      margin: 0;
      color: #625b6d;
      font-size: 13px;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 3;
      text-align: center;
      color: #4e4858;
      font-size: 12px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(0.9);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    @keyframes pulseSmall {
      0%,
      100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(0.85);
      }

      50% {
        opacity: 0.75;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px;
      }

      .logo-wrapper {
        width: 115px;
        height: 115px;
        padding: 19px;
        border-radius: 30px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 47px;
        letter-spacing: -2.5px;
      }

      .description {
        margin-top: 22px;
        font-size: 15px;
        line-height: 1.7;
      }

      .footer {
        bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="glow"></div>
    <div class="glow-small"></div>
    <div class="grid"></div>
  </div>

  <div class="container">
    <main class="content">

      <div class="logo-wrapper">
        <img
          src="biofyit.png"
          alt="Biofyit"
          class="logo"
        >
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Under Maintenance
      </div>

      <h1>
        We're working
        <span>behind the scenes.</span>
      </h1>

      <p class="description">
        Biofyit is currently being worked on while we build and improve
        the platform. We're creating a free place where anyone can make
        and share their own personal bio page.
      </p>

      <div class="divider"></div>

      <p class="small-text">
        The site will be back soon.
      </p>

    </main>
  </div>

  <div class="footer">
    © 2026 Biofyit
  </div>

</body>
</html>
