<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rankora Invoice Generator</title>
<style>
:root{--ink:#111426;--red:#d71920;--line:#d9dce3;--muted:#69707d;--bg:#f4f5f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
.wrap{max-width:1200px;margin:auto;padding:28px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:14px}.logo{width:72px;height:72px;object-fit:cover;border-radius:12px;background:white}h1{margin:0;font-size:28px}p{color:var(--muted)}
.grid{display:grid;grid-template-columns:400px 1fr;gap:24px}.card,.invoice{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{width:100%;padding:13px;border:0;border-radius:8px;font-weight:bold;margin-top:12px;cursor:pointer}
.red{background:var(--red);color:#fff}.gray{background:#e9ebef;color:var(--ink)}#status{min-height:24px;font-size:13px;margin-top:12px;color:var(--muted)}
.head{display:flex;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:20px}.head img{width:110px;height:70px;object-fit:contain}.title{text-align:right}.title h2{font-size:42px;margin:0}
.info{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:28px 0}small{color:var(--muted);font-weight:bold;text-transform:uppercase}
table{width:100%;border-collapse:collapse}th{background:var(--ink);color:#fff;text-align:left;padding:12px}td{padding:13px;border-bottom:1px solid var(--line)}.right{text-align:right}
.total{margin:25px 0 0 auto;width:300px;border-top:2px solid var(--ink);padding-top:12px;display:flex;justify-content:space-between;font-size:20px;font-weight:bold}
@media(max-width:850px){.grid{grid-template-columns:1fr}}@media(max-width:550px){header,.head{flex-direction:column;align-items:flex-start}.row,.info{grid-template-columns:1fr}}
@media print{header,.card{display:none}.wrap{padding:0}.grid{display:block}.invoice{border:0;box-shadow:none}}
</style>
</head>

<div class="info"><div><small>Bill To</small><h3 id="pname">Customer Name</h3><div id="pemail"></div><div id="pphone"></div><div id="paddress"></div></div><div><small>From</small><h3>Rankora</h3><div>386-868-9183</div><div id="pdue"></div></div></div>

</article></div></div>
<script>
const ids=["name","email","phone","address","number","due","product","qty","price","notes"];
const $=id=>document.getElementById(id),v=id=>$(id).value,m=x=>"$"+(Number(x)||0).toFixed(2);
function update(){
 const total=(Number(v("qty"))||0)*(Number(v("price"))||0);
 $("pname").textContent=v("name")||"Customer Name"; $("pemail").textContent=v("email"); $("pphone").textContent=v("phone"); $("paddress").textContent=v("address");
 $("pnumber").textContent="Invoice #"+(v("number")||"—"); $("pdue").textContent="Due: "+(v("due")||"Not selected");
 $("pproduct").textContent=v("product")||"Product"; $("pqty").textContent=v("qty")||"0"; $("pprice").textContent=m(v("price"));
 $("ptotal").textContent=m(total); $("grand").textContent=m(total);
}
ids.forEach(id=>$(id).addEventListener("input",update)); update();

$("send").addEventListener("click",async()=>{
 const p={customerName:v("name"),customerEmail:v("email"),customerPhone:v("phone"),customerAddress:v("address"),invoiceNumber:v("number"),dueDate:v("due"),product:v("product"),quantity:v("qty"),unitPrice:v("price"),notes:v("notes"),total:(Number(v("qty"))||0)*(Number(v("price"))||0)};
 if(!p.customerName||!p.customerEmail||!p.invoiceNumber||!p.dueDate||!p.product){$("status").textContent="Fill out all required fields.";return;}
 $("status").textContent="Sending invoice...";
 try {
   const r=await fetch("/api/send-invoice",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
   const text=await r.text();
   let d; try{d=JSON.parse(text)}catch{throw new Error("Vercel returned a non-API response. Make sure the api folder is in the project root and redeploy.")}
   if(!r.ok)throw new Error(d.error||"Could not send invoice.");
   $("status").textContent="Invoice sent successfully!";
 } catch(e) { $("status").textContent=e.message; }
});
</script>
