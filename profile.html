<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biofyit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050308;color:#fff}
body{min-height:100vh;overflow-x:hidden}
#background{position:fixed;inset:0;background:#050308 center/cover no-repeat;z-index:-3}
#overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(126,43,255,.2),transparent 45%),linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.82));z-index:-2}
#noise{position:fixed;inset:0;opacity:.035;pointer-events:none;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px}
.card{width:min(650px,100%);padding:42px 30px;border:1px solid rgba(255,255,255,.12);background:rgba(8,6,14,.62);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:30px;box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 80px rgba(125,35,255,.12);text-align:center}
.pfp{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.18);box-shadow:0 0 40px rgba(139,63,255,.35);margin:0 auto 20px;display:block;background:#120d1c}
.name{font-size:34px;font-weight:800;line-height:1.1;margin:0}
.name.gradient{background:linear-gradient(90deg,#fff,#c993ff,#8b3dff,#fff);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradient 5s linear infinite}
.name.uppercase{text-transform:uppercase}
.name.wide{letter-spacing:.12em}
.glow{text-shadow:0 0 10px rgba(158,85,255,.7),0 0 35px rgba(119,39,255,.45)}
.bio{margin:14px auto 25px;max-width:510px;color:rgba(255,255,255,.68);font-size:15px;line-height:1.7;white-space:pre-wrap}
.bio.glow{text-shadow:0 0 12px rgba(163,89,255,.45)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.link{display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:14px;text-decoration:none;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);transition:.2s ease;font-size:14px}
.link:hover{transform:translateY(-3px);background:rgba(143,65,255,.18);border-color:rgba(173,115,255,.4);box-shadow:0 10px 30px rgba(103,35,190,.2)}
.icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.music{margin:28px auto 0;max-width:460px}
audio{width:100%;height:40px}
.loading{font-size:14px;color:rgba(255,255,255,.5)}
.error{font-size:15px;color:#ff8caa}
.footer{margin-top:28px;font-size:11px;color:rgba(255,255,255,.3)}
@keyframes gradient{to{background-position:250% center}}
@media(max-width:500px){
.card{padding:34px 20px;border-radius:24px}
.name{font-size:28px}
.pfp{width:96px;height:96px}
}
</style>
</head>
<body>
<div id="background"></div>
<div id="overlay"></div>
<div id="noise"></div>

<main class="page">
<section class="card">
<div id="content" class="loading">Loading profile...</div>
</section>
</main>

<script>
const params=new URLSearchParams(location.search);
const usernameFromQuery=params.get("username")||location.pathname.split("/").filter(Boolean).pop();

const platformNames={
discord:"Discord",
instagram:"Instagram",
tiktok:"TikTok",
youtube:"YouTube",
x:"X",
facebook:"Facebook",
snapchat:"Snapchat",
twitch:"Twitch",
kick:"Kick",
github:"GitHub",
reddit:"Reddit",
spotify:"Spotify",
soundcloud:"SoundCloud",
steam:"Steam",
roblox:"Roblox",
xbox:"Xbox",
playstation:"PlayStation",
linkedin:"LinkedIn",
threads:"Threads",
bluesky:"Bluesky",
telegram:"Telegram",
pinterest:"Pinterest",
tumblr:"Tumblr",
gitlab:"GitLab",
codepen:"CodePen",
patreon:"Patreon",
kofi:"Ko-fi",
cashapp:"Cash App",
venmo:"Venmo",
paypal:"PayPal",
custom:"Link"
};

const fonts={
Inter:"Inter",
"DM Sans":"DM Sans",
Manrope:"Manrope",
Montserrat:"Montserrat",
Outfit:"Outfit",
Poppins:"Poppins",
"Space Grotesk":"Space Grotesk"
};

const icons={
discord:"DC",
instagram:"IG",
tiktok:"TT",
youtube:"YT",
x:"X",
facebook:"F",
snapchat:"SC",
twitch:"TW",
kick:"K",
github:"GH",
reddit:"R",
spotify:"SP",
soundcloud:"S",
steam:"ST",
roblox:"RB",
xbox:"XB",
playstation:"PS",
linkedin:"IN",
threads:"TH",
bluesky:"BS",
telegram:"TG",
pinterest:"PI",
tumblr:"TU",
gitlab:"GL",
codepen:"CP",
patreon:"PA",
kofi:"KO",
cashapp:"CA",
venmo:"VE",
paypal:"PP",
custom:"↗"
};

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function loadProfile(){
if(!usernameFromQuery){
document.getElementById("content").innerHTML='<div class="error">Profile not found.</div>';
return;
}

try{
const response=await fetch("/api/profile?username="+encodeURIComponent(usernameFromQuery),{cache:"no-store"});
const result=await response.json();

if(!response.ok||!result.success){
throw new Error(result.error||"Profile not found.");
}

renderProfile(result.profile);
}catch(error){
document.getElementById("content").innerHTML='<div class="error">'+escapeHtml(error.message)+'</div>';
}
}

function renderProfile(profile){
const customization=profile.customization||{};
const font=fonts[customization.font]||"Inter";
const nameStyle=customization.nameStyle||"normal";

document.body.style.fontFamily="'"+font+"',Arial,sans-serif";

if(profile.background){
document.getElementById("background").style.backgroundImage="url('"+profile.background.replace(/'/g,"%27")+"')";
}

const nameClasses=[
"name",
nameStyle==="gradient"?"gradient":"",
nameStyle==="uppercase"?"uppercase":"",
nameStyle==="wide"?"wide":"",
customization.nameGlow?"glow":""
].filter(Boolean).join(" ");

const bioClasses=[
"bio",
customization.bioGlow?"glow":""
].filter(Boolean).join(" ");

const links=Array.isArray(profile.links)?profile.links:[];

const linksHtml=links.map(link=>{
const platform=String(link.platform||"custom").toLowerCase();
const title=escapeHtml(link.title||platformNames[platform]||"Link");
const url=escapeHtml(link.url||"#");
const icon=escapeHtml(icons[platform]||"↗");
return '<a class="link" href="'+url+'" target="_blank" rel="noopener noreferrer"><span class="icon">'+icon+'</span><span>'+title+'</span></a>';
}).join("");

const music=profile.music
?'<div class="music"><audio controls preload="none" src="'+escapeHtml(profile.music)+'"></audio></div>'
:"";

document.title=(profile.displayName||profile.username||"Biofyit")+" | Biofyit";

document.getElementById("content").innerHTML=`
${profile.profilePicture?'<img class="pfp" src="'+escapeHtml(profile.profilePicture)+'" alt="">':""}
<h1 class="${nameClasses}">${escapeHtml(profile.displayName||profile.username)}</h1>
${profile.bio?'<div class="'+bioClasses+'">'+escapeHtml(profile.bio)+'</div>':""}
${links.length?'<div class="links">'+linksHtml+"</div>":""}
${music}
<div class="footer">biofyit.com/${escapeHtml(profile.username||usernameFromQuery)}</div>
`;
}

loadProfile();
</script>
</body>
</html>
