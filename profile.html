<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biofyit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,Arial,sans-serif}
body{background:#050507;color:#fff;overflow-x:hidden}
button{font:inherit}
.page{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 18px;overflow:hidden}
.background{position:fixed;inset:0;background:#050507 center/cover no-repeat;z-index:-4}
.background:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,3,6,.48),rgba(3,3,6,.78))}
.glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.18;pointer-events:none;z-index:-3}
.glow.one{background:#7c3aed;top:-230px;left:-180px}
.glow.two{background:#a855f7;right:-220px;bottom:-240px}
.profile{width:min(760px,100%);position:relative}
.card{background:rgba(10,10,15,.68);border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 100px rgba(0,0,0,.45),0 0 80px rgba(124,58,237,.10);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:30px;padding:38px}
.identity{text-align:center}
.pfp-wrap{position:relative;width:118px;height:118px;margin:0 auto 18px}
.pfp{width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.10);box-shadow:0 15px 45px rgba(0,0,0,.4)}
.status{position:absolute;right:3px;bottom:5px;width:27px;height:27px;border-radius:50%;border:5px solid #0a0a0f;background:#747f8d}
.status.online{background:#23a55a}
.status.idle{background:#f0b232}
.status.dnd{background:#f23f43}
.status.offline{background:#747f8d}
.name{font-size:32px;font-weight:800;letter-spacing:-1.5px;margin:0}
.username{font-size:14px;color:#a8a8b3;margin-top:5px}
.badges{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;margin:13px 0 0}
.badge{height:28px;min-width:28px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#ddd}
.badge img{width:16px;height:16px;object-fit:contain}
.bio{max-width:590px;margin:22px auto 0;color:#d0d0d8;line-height:1.65;font-size:15px;white-space:pre-wrap}
.custom-status{display:none;margin:18px auto 0;width:max-content;max-width:100%;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:#ddd;font-size:13px}
.links{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:24px}
.social{width:43px;height:43px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);transition:.2s;text-decoration:none;color:#fff;font-weight:700;font-size:12px}
.social:hover{transform:translateY(-3px);background:rgba(124,58,237,.18);border-color:rgba(168,85,247,.35)}
.social svg{width:19px;height:19px;fill:currentColor}
.presence{margin-top:28px;text-align:left}
.presence-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:20px}
.presence-head{display:flex;align-items:center;justify-content:space-between;gap:15px}
.presence-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#888895;font-weight:700}
.presence-state{display:flex;align-items:center;gap:7px;font-size:12px;color:#aaa}
.state-dot{width:8px;height:8px;border-radius:50%;background:#747f8d}
.state-dot.online{background:#23a55a}
.state-dot.idle{background:#f0b232}
.state-dot.dnd{background:#f23f43}
.presence-content{margin-top:17px}
.activity{display:none;align-items:center;gap:15px}
.activity-image{width:72px;height:72px;border-radius:14px;object-fit:cover;background:#17171d;flex-shrink:0}
.activity-info{min-width:0}
.activity-type{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8e8e99;font-weight:700}
.activity-name{font-size:17px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-details{font-size:13px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-state{font-size:13px;color:#aaa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spotify{display:none;margin-top:16px;padding:13px;border-radius:17px;background:rgba(30,215,96,.07);border:1px solid rgba(30,215,96,.13)}
.spotify-inner{display:flex;align-items:center;gap:13px}
.spotify img{width:58px;height:58px;border-radius:10px;object-fit:cover}
.spotify-info{min-width:0;flex:1}
.spotify-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6edb94;font-weight:700}
.spotify-song{font-size:15px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spotify-artist{font-size:12px;color:#aaa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spotify-progress{margin-top:12px;height:3px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.spotify-progress span{display:block;height:100%;width:0;background:#1ed760}
.music-player{display:none;margin-top:24px}
audio{width:100%;height:38px}
.footer{text-align:center;margin-top:25px;color:#696974;font-size:11px}
.footer a{color:#9696a4;text-decoration:none}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050507;z-index:20}
.loader{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:#a855f7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.name.gradient{background:linear-gradient(90deg,#fff,#c084fc,#a855f7,#fff);background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientMove 5s linear infinite}
.name.uppercase{text-transform:uppercase}
.name.wide{letter-spacing:5px}
.name.glow{text-shadow:0 0 18px rgba(168,85,247,.65),0 0 45px rgba(124,58,237,.25)}
.bio.glow{text-shadow:0 0 16px rgba(168,85,247,.25)}
@keyframes gradientMove{0%{background-position:0%}100%{background-position:220%}}
@media(max-width:600px){
.page{padding:18px 12px}
.card{padding:27px 19px;border-radius:24px}
.pfp-wrap,.pfp{width:100px;height:100px}
.name{font-size:27px}
.activity-image{width:60px;height:60px}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loader"></div></div>
<div class="background" id="background"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="page">
<section class="profile">
<div class="card">
<div class="identity">
<div class="pfp-wrap">
<img class="pfp" id="pfp" src="" alt="">
<div class="status offline" id="status"></div>
</div>

<h1 class="name" id="name">Biofyit User</h1>
<div class="username" id="username"></div>
<div class="badges" id="badges"></div>
<div class="custom-status" id="customStatus"></div>
<div class="bio" id="bio"></div>
<div class="links" id="links"></div>
</div>

<div class="presence" id="presence">
<div class="presence-card">
<div class="presence-head">
<div class="presence-title">Discord Presence</div>
<div class="presence-state">
<span class="state-dot offline" id="stateDot"></span>
<span id="stateText">Offline</span>
</div>
</div>

<div class="presence-content">
<div class="activity" id="activity">
<img class="activity-image" id="activityImage" src="" alt="">
<div class="activity-info">
<div class="activity-type" id="activityType"></div>
<div class="activity-name" id="activityName"></div>
<div class="activity-details" id="activityDetails"></div>
<div class="activity-state" id="activityState"></div>
</div>
</div>

<div class="spotify" id="spotify">
<div class="spotify-inner">
<img id="spotifyImage" src="" alt="">
<div class="spotify-info">
<div class="spotify-label">Listening to Spotify</div>
<div class="spotify-song" id="spotifySong"></div>
<div class="spotify-artist" id="spotifyArtist"></div>
</div>
</div>
<div class="spotify-progress"><span id="spotifyProgress"></span></div>
</div>
</div>
</div>
</div>

<div class="music-player" id="musicPlayer">
<audio id="audio" controls></audio>
</div>

<div class="footer">
Powered by <a href="https://biofyit.com">Biofyit</a>
</div>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);

const platformIcons={
discord:`<svg viewBox="0 0 24 24"><path d="M19.54 5.32A16.5 16.5 0 0 0 15.49 4l-.49 1a15.3 15.3 0 0 0-5.99 0l-.5-1a16.5 16.5 0 0 0-4.05 1.32C1.9 9.35 1.2 13.28 1.55 17.16a16.5 16.5 0 0 0 4.97 2.5l1.2-1.65c-.66-.24-1.3-.55-1.9-.91l.47-.36c3.66 1.7 7.65 1.7 11.27 0l.48.36c-.61.36-1.25.67-1.91.91l1.2 1.65a16.5 16.5 0 0 0 4.97-2.5c.4-4.5-.69-8.4-2.76-11.84ZM8.48 15.27c-1.1 0-2.01-1-2.01-2.23s.88-2.23 2.01-2.23 2.02 1 2.01 2.23c0 1.23-.89 2.23-2.01 2.23Zm7.04 0c-1.1 0-2.01-1-2.01-2.23s.88-2.23 2.01-2.23 2.02 1 2.01 2.23c0 1.23-.89 2.23-2.01 2.23Z"/></svg>`,
instagram:`<svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5Z"/></svg>`,
github:`<svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.05c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.66-.3-5.46-1.33-5.46-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.4 11.4 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.76.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.62-5.47 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/></svg>`,
youtube:`<svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.12C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.4.58A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.12c1.86.58 9.4.58 9.4.58s7.54 0 9.4-.58a3 3 0 0 0 2.1-2.12A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.5v-7l6.2 3.5-6.2 3.5Z"/></svg>`,
tiktok:`<svg viewBox="0 0 24 24"><path d="M16 2h3c.2 1.8 1.2 3.2 3 3.7v3.1a8.3 8.3 0 0 1-3-.9v6.2A7 7 0 1 1 13 7.1v3.2a3.8 3.8 0 1 0 2.9 3.7V2Z"/></svg>`,
x:`<svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.36l7.24-8.28L2.8 2h6.4l4.42 5.84L18.9 2Zm-1.1 17.8h1.73L8.27 4.08H6.42L17.8 19.8Z"/></svg>`
};

const badgeNames={
staff:"Discord Staff",
partner:"Discord Partner",
hypesquad:"HypeSquad",
bug_hunter:"Bug Hunter",
hypesquad_bravery:"HypeSquad Bravery",
hypesquad_brilliance:"HypeSquad Brilliance",
hypesquad_balance:"HypeSquad Balance",
early_supporter:"Early Supporter",
team_user:"Discord Team",
bug_hunter_level_2:"Bug Hunter Level 2",
verified_bot:"Verified Bot Developer",
verified_developer:"Early Verified Bot Developer",
certified_moderator:"Certified Moderator",
active_developer:"Active Developer"
};

function escapeHtml(value){
return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function getUsername(){
const path=location.pathname.split("/").filter(Boolean);
if(path.length)return decodeURIComponent(path[path.length-1]);
return new URLSearchParams(location.search).get("username");
}

function setStatus(status){
const normalized=String(status||"offline").toLowerCase();
$("status").className="status "+normalized;
$("stateDot").className="state-dot "+normalized;
$("stateText").textContent=normalized==="dnd"?"Do Not Disturb":normalized.charAt(0).toUpperCase()+normalized.slice(1);
}

function applyCustomization(c){
if(!c)return;
const name=$("name");
const bio=$("bio");
name.classList.remove("gradient","uppercase","wide","glow");
bio.classList.remove("glow");
if(c.nameStyle)name.classList.add(c.nameStyle);
if(c.nameGlow)name.classList.add("glow");
if(c.bioGlow)bio.classList.add("glow");
if(c.font)document.body.style.fontFamily=`"${c.font}",Inter,Arial,sans-serif`;
}

function renderBadges(badges){
$("badges").innerHTML="";
if(!Array.isArray(badges))return;
badges.forEach(badge=>{
const el=document.createElement("div");
el.className="badge";
el.title=badgeNames[badge]||badge;
el.textContent=badgeNames[badge]||badge;
$("badges").appendChild(el);
});
}

function renderActivity(activity){
if(!activity){
$("activity").style.display="none";
return;
}
$("activity").style.display="flex";
const type=activity.type||"activity";
$("activityType").textContent=type;
$("activityName").textContent=activity.name||"";
$("activityDetails").textContent=activity.details||"";
$("activityState").textContent=activity.state||"";
$("activityDetails").style.display=activity.details?"block":"none";
$("activityState").style.display=activity.state?"block":"none";
let image="";
if(activity.assets&&activity.assets.large_image){
const asset=activity.assets.large_image;
if(asset.startsWith("mp:external/")){
const clean=asset.replace("mp:external/","");
const slash=clean.indexOf("/");
if(slash>-1)image="https://"+clean.slice(slash+1);
}else if(asset.startsWith("https://")){
image=asset;
}
}
$("activityImage").src=image||"";
$("activityImage").style.display=image?"block":"none";
}

function renderSpotify(data){
if(!data){
$("spotify").style.display="none";
return;
}
$("spotify").style.display="block";
$("spotifyImage").src=data.album_art_url||"";
$("spotifySong").textContent=data.song||"";
$("spotifyArtist").textContent=data.artist||"";
updateSpotifyProgress(data);
}

function updateSpotifyProgress(data){
if(!data||!data.start||!data.end){
$("spotifyProgress").style.width="0%";
return;
}
const start=new Date(data.start).getTime();
const end=new Date(data.end).getTime();
const now=Date.now();
const percent=Math.max(0,Math.min(100,((now-start)/(end-start))*100));
$("spotifyProgress").style.width=percent+"%";
}

async function loadPresence(discordId){
if(!discordId)return;
try{
const response=await fetch("/api/presence?discordId="+encodeURIComponent(discordId),{cache:"no-store"});
const data=await response.json();
if(!data.success)return;

const presence=data.presence||data;

if(presence.avatar){
$("pfp").src=presence.avatar;
}

if(presence.display_name){
$("name").textContent=presence.display_name;
}

if(presence.username){
$("username").textContent="@"+presence.username;
}

setStatus(presence.status);
renderBadges(presence.badges);

const custom=presence.custom_status;
if(custom&&custom.text){
$("customStatus").style.display="block";
$("customStatus").textContent=(custom.emoji?custom.emoji+" ":"")+custom.text;
}else{
$("customStatus").style.display="none";
}

const activities=Array.isArray(presence.activities)?presence.activities:[];
renderActivity(activities[0]||null);
renderSpotify(presence.spotify);

if(presence.spotify){
setInterval(()=>updateSpotifyProgress(presence.spotify),1000);
}
}catch(error){
console.error(error);
}
}

async function loadProfile(){
const username=getUsername();

if(!username){
location.href="/";
return;
}

try{
const response=await fetch("/api/profile?username="+encodeURIComponent(username),{cache:"no-store"});
const data=await response.json();

if(!data.success||!data.profile){
document.title="Profile not found | Biofyit";
$("loading").innerHTML="<div style='text-align:center;color:#aaa'>Profile not found</div>";
return;
}

const profile=data.profile;

document.title=(profile.displayName||profile.username)+" | Biofyit";

$("name").textContent=profile.displayName||profile.username;
$("username").textContent="@"+profile.username;
$("bio").textContent=profile.bio||"";

if(profile.profilePicture){
$("pfp").src=profile.profilePicture;
}

if(profile.background){
$("background").style.backgroundImage=`url("${profile.background}")`;
}

if(profile.music){
$("audio").src=profile.music;
$("musicPlayer").style.display="block";
}

applyCustomization(profile.customization);

const links=Array.isArray(profile.links)?profile.links:[];
$("links").innerHTML="";

links.forEach(link=>{
if(!link||!link.url)return;

const a=document.createElement("a");
a.className="social";
a.href=link.url;
a.target="_blank";
a.rel="noopener noreferrer";
a.title=link.platform||"Link";

const key=String(link.platform||"custom").toLowerCase();

if(platformIcons[key]){
a.innerHTML=platformIcons[key];
}else{
a.textContent=(link.label||link.platform||"Link").slice(0,2).toUpperCase();
}

$("links").appendChild(a);
});

if(profile.lanyard&&profile.lanyard.id){
await loadPresence(profile.lanyard.id);
}else{
setStatus("offline");
}

$("loading").classList.add("hidden");

}catch(error){
console.error(error);
$("loading").innerHTML="<div style='text-align:center;color:#aaa'>Unable to load profile</div>";
}
}

loadProfile();
</script>
</body>
</html>
