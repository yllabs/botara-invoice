<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biofyit | Sign In</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#07070b;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.glow{position:absolute;width:500px;height:500px;border-radius:50%;background:#7625d8;filter:blur(160px);opacity:.16;top:-180px;left:50%;transform:translateX(-50%)}
.card{width:100%;max-width:410px;background:#0d0d12;border:1px solid #20202a;border-radius:14px;padding:34px;position:relative;box-shadow:0 25px 80px #0008}
.logo{text-align:center;font-size:27px;font-weight:800;margin-bottom:8px}
.logo span{color:#9147ff}
.subtitle{text-align:center;color:#74747f;font-size:13px;margin-bottom:28px}
label{display:block;font-size:12px;color:#aaaab5;margin-bottom:7px}
.field{margin-bottom:17px}
input{width:100%;height:44px;background:#101016;border:1px solid #282832;border-radius:8px;color:#fff;padding:0 13px;outline:none;font-size:13px}
input:focus{border-color:#8142db}
button{width:100%;height:44px;border:0;border-radius:8px;background:#8142db;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
button:hover{background:#914cf0}
button:disabled{opacity:.6;cursor:not-allowed}
.error{background:#211116;border:1px solid #4b242d;color:#e9a5af;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:16px;display:none}
.bottom{text-align:center;color:#6f6f7a;font-size:12px;margin-top:22px}
.bottom a{color:#a56bff;text-decoration:none}
</style>
</head>
<body>
<div class="bg"><div class="glow"></div></div>

<div class="card">
<div class="logo">Bio<span>fyit</span></div>
<div class="subtitle">Sign in to manage your profile.</div>

<div id="error" class="error"></div>

<form id="form">
<div class="field">
<label>Email or username</label>
<input id="identifier" autocomplete="username" required>
</div>

<div class="field">
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
</div>

<button id="submit" type="submit">Sign In</button>
</form>

<div class="bottom">
Don't have an account? <a href="/create-account.html">Create one</a>
</div>
</div>

<script>
const form=document.getElementById("form");
const error=document.getElementById("error");
const submit=document.getElementById("submit");

form.addEventListener("submit",async e=>{
e.preventDefault();

error.style.display="none";
submit.disabled=true;
submit.textContent="Signing in...";

try{
const response=await fetch("/api/auth?action=login",{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:document.getElementById("identifier").value.trim(),
password:document.getElementById("password").value
})
});

const data=await response.json();

if(!response.ok||!data.success){
throw new Error(data.error||"Unable to sign in.");
}

window.location.replace("/dashboard.html");
}catch(err){
error.textContent=err.message;
error.style.display="block";
submit.disabled=false;
submit.textContent="Sign In";
}
});
</script>
</body>
</html>
