<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Biofyit</title>
  <link rel="icon" href="biofyit.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050507;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #7c3cff;
      filter: blur(150px);
      opacity: .16;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 38px;
      background: rgba(13,13,18,.9);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
      position: relative;
      z-index: 2;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      font-size: 29px;
    }

    .subtitle {
      color: #858590;
      text-align: center;
      font-size: 14px;
      margin: 9px 0 28px;
    }

    label {
      display: block;
      color: #bdbdc7;
      font-size: 13px;
      font-weight: 600;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 11px;
      color: #fff;
      outline: none;
    }

    input:focus {
      border-color: rgba(139,92,246,.7);
    }

    button {
      width: 100%;
      height: 49px;
      margin-top: 23px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 10px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.2);
      color: #fca5a5;
      font-size: 13px;
      text-align: center;
    }

    .bottom {
      text-align: center;
      margin-top: 23px;
      color: #777782;
      font-size: 13px;
    }

    .bottom a {
      color: #a78bfa;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="card">

    <div class="logo">
      <img src="biofyit.png" alt="Biofyit">
    </div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Sign in to manage your Biofyit profile.
    </p>

    <form id="loginForm">

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Your password"
        required
      >

      <button type="submit">Sign In</button>

      <div class="error" id="error"></div>

    </form>

    <div class="bottom">
      Don't have an account?
      <a href="/create-account.html">Create one</a>
    </div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      error.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Invalid email or password.");
        }

        window.location.href = "/dashboard.html";

      } catch (err) {
        error.textContent = err.message;
        error.style.display = "block";
      }
    });
  </script>

</body>
</html>
