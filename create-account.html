<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Biofyit</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(123, 72, 255, .2), transparent 40%),
        #050308;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(12, 9, 19, .85);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
    }

    .logo {
      display: block;
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 29px;
    }

    .subtitle {
      margin: 9px 0 28px;
      text-align: center;
      color: rgba(255,255,255,.5);
      font-size: 14px;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      color: rgba(255,255,255,.72);
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      outline: none;
      background: rgba(255,255,255,.045);
      color: white;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(137, 91, 255, .65);
      background: rgba(137, 91, 255, .06);
    }

    button {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 12px;
      background: #7c4dff;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #8b63ff;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 11px;
      background: rgba(255, 70, 70, .09);
      border: 1px solid rgba(255, 70, 70, .18);
      color: #ff9c9c;
      font-size: 13px;
      line-height: 1.5;
    }

    .login {
      margin-top: 22px;
      text-align: center;
      color: rgba(255,255,255,.45);
      font-size: 13px;
    }

    .login a {
      color: #9b72ff;
      text-decoration: none;
    }

    .login a:hover {
      text-decoration: underline;
    }

    .username-hint {
      margin: -9px 0 18px;
      color: rgba(255,255,255,.32);
      font-size: 11px;
    }
  </style>

</head>

<body>

  <main class="card">

```
<img
  class="logo"
  src="/biofyit.png"
  alt="Biofyit"
>

<h1>Create your account</h1>

<p class="subtitle">
  Claim your Biofyit username and create your profile.
</p>

<div class="message" id="message"></div>

<form id="registerForm">

  <label for="email">Email</label>

  <input
    id="email"
    name="email"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    required
  >

  <label for="username">Username</label>

  <input
    id="username"
    name="username"
    type="text"
    placeholder="yourname"
    autocomplete="username"
    minlength="3"
    maxlength="32"
    pattern="[A-Za-z0-9_]+"
    required
  >

  <div class="username-hint">
    3-32 characters. Letters, numbers, and underscores only.
  </div>

  <label for="password">Password</label>

  <input
    id="password"
    name="password"
    type="password"
    placeholder="Create a password"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <label for="confirmPassword">Confirm password</label>

  <input
    id="confirmPassword"
    name="confirmPassword"
    type="password"
    placeholder="Confirm your password"
    autocomplete="new-password"
    minlength="8"
    required
  >

  <button id="registerButton" type="submit">
    Create Account
  </button>

</form>

<div class="login">
  Already have an account?
  <a href="/login.html">Sign in</a>
</div>
```

  </main>

  <script>
    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      message.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must be at least 8 characters.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            username,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(
            data.error || "Unable to create your account."
          );

          button.disabled = false;
          button.textContent = "Create Account";
          return;
        }

        window.location.href = "/dashboard.html";

      } catch {
        showMessage(
          "Something went wrong. Please try again."
        );

        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
